name: Build Hexo

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Update submodules
      run: |
        git submodule update --init --recursive
        ls -la themes/

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Hexo
      run: npm run build

    - name: Add .nojekyll file
      run: touch ./docs/.nojekyll

    - name: Commit and Push to master
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add docs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Deploy: Update docs folder [skip ci]"
        git push
